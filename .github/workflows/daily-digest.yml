name: Daily Tech News Agent

on:
  schedule:
    # 02:30 UTC is 08:00 Asia/Kolkata.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the digest and record its articles as sent
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-tech-news-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check source syntax
        run: npm run build

      - name: Run agent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          MAX_ARTICLE_AGE_HOURS: ${{ vars.MAX_ARTICLE_AGE_HOURS || '25' }}
          TOP_ARTICLES_COUNT: ${{ vars.TOP_ARTICLES_COUNT || '8' }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            npm run send
          else
            npm start
          fi
